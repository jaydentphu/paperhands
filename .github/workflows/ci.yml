name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: options_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d options_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/options_agent
      ANTHROPIC_API_KEY: test-key-not-real
      RUNTIME_MODEL: claude-sonnet-5
      ADAPTER: robinhood
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run checks
        run: make check
