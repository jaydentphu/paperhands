server {
    # Both: the compose healthcheck runs wget against "localhost" inside the
    # container, which resolves to ::1 first. IPv4-only meant "unhealthy"
    # while the host could reach it fine.
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # The app does its own routing in the browser (/positions, /scoreboard,
    # /logs are not files). Serve a real file when one exists, otherwise
    # hand back index.html and let the app route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
