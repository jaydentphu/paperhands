<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Paper Hands architecture</title>
  <desc id="d">Top row shows the capability boundary: Robinhood MCP with 73 tools, a transport allowlist of 7 read-only tools, a gateway allowlist of 5 functions, then the research agent. Bottom row shows the daily pipeline from snapshot to dashboard.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a99aa"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ee0b5"/>
    </marker>
  </defs>
  <rect width="1100" height="460" rx="20" fill="#0b0f14"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="52" font-size="12" fill="#8a99aa" letter-spacing="1.5">// CAPABILITY BOUNDARY</text>

    <rect x="30" y="80" width="240" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="150" y="115" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Robinhood Trading MCP</text>
    <text x="150" y="139" font-size="11" fill="#8a99aa" text-anchor="middle">73 tools · full-scope token</text>

    <rect x="320" y="80" width="240" height="84" rx="16" fill="#121923" stroke="#7ee0b5" stroke-opacity="0.5"/>
    <text x="440" y="115" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Transport allowlist</text>
    <text x="440" y="139" font-size="11" fill="#8a99aa" text-anchor="middle">7 read-only tool names</text>

    <rect x="610" y="80" width="240" height="84" rx="16" fill="#121923" stroke="#7ee0b5" stroke-opacity="0.5"/>
    <text x="730" y="115" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">DataGateway</text>
    <text x="730" y="139" font-size="11" fill="#8a99aa" text-anchor="middle">5 allowlisted functions</text>

    <rect x="900" y="80" width="170" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="985" y="115" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Research agent</text>
    <text x="985" y="139" font-size="11" fill="#8a99aa" text-anchor="middle">claude-sonnet-5</text>

    <line x1="270" y1="122" x2="318" y2="122" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="560" y1="122" x2="608" y2="122" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="850" y1="122" x2="898" y2="122" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>

    <text x="440" y="196" font-size="11" fill="#f08a8a" text-anchor="middle">place, review, cancel, exercise: no code path reaches them</text>
    <text x="440" y="216" font-size="11" fill="#7ee0b5" text-anchor="middle">a named CI job fails the build if this boundary moves</text>

    <text x="30" y="272" font-size="12" fill="#8a99aa" letter-spacing="1.5">// DAILY PIPELINE</text>

    <path d="M985 164 V240 H280 V298" fill="none" stroke="#7ee0b5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahm)"/>
    <text x="640" y="233" font-size="11" fill="#8a99aa" text-anchor="middle">schema-checked TradeCandidate</text>

    <rect x="20" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="100" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Snapshot + filter</text>
    <text x="100" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">liquidity rules</text>

    <rect x="200" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="280" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Three cohorts</text>
    <text x="280" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">cash · rules · agent</text>

    <rect x="380" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="460" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Validator</text>
    <text x="460" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">eligible, under cap</text>

    <rect x="560" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="640" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Paper portfolio</text>
    <text x="640" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">ask in, bid out</text>

    <rect x="740" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="820" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">Evaluator</text>
    <text x="820" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">P&amp;L and hit rate</text>

    <rect x="920" y="300" width="160" height="84" rx="16" fill="#121923" stroke="#243040"/>
    <text x="1000" y="335" font-size="13" font-weight="700" fill="#d7e0ea" text-anchor="middle">API + dashboard</text>
    <text x="1000" y="359" font-size="11" fill="#8a99aa" text-anchor="middle">read-only</text>

    <line x1="180" y1="342" x2="198" y2="342" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="360" y1="342" x2="378" y2="342" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="540" y1="342" x2="558" y2="342" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="720" y1="342" x2="738" y2="342" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>
    <line x1="900" y1="342" x2="918" y2="342" stroke="#8a99aa" stroke-width="1.5" marker-end="url(#ah)"/>

    <text x="550" y="428" font-size="11" fill="#8a99aa" text-anchor="middle">simulated fills only · no real orders in Phase 1</text>
  </g>
</svg>
